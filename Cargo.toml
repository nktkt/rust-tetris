[package]
name = "tetris"
version = "0.1.0"
edition = "2021"
authors = ["nktkt"]
description = "A terminal-based Tetris clone in Rust with full SRS, T-spin detection, hold, lock delay, DAS/ARR, and game modes."
license = "MIT"
repository = "https://github.com/nktkt/rust-tetris"
homepage = "https://github.com/nktkt/rust-tetris"
readme = "README.md"
keywords = ["tetris", "tui", "game", "terminal", "crossterm"]
categories = ["games", "command-line-utilities"]

[dependencies]
crossterm = "0.27"
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
